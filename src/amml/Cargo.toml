[package]
name = "durability-ping-amml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "alaydriem_durability_ping"
crate-type = ["cdylib", "rlib"]

[dependencies]
durability-ping-core.workspace = true
amml-api.workspace = true
amm-client.workspace = true
amm-core.workspace = true
curia.workspace = true
hcl-rs.workspace = true
rodio.workspace = true
serde.workspace = true

[dev-dependencies]
amml-api = { workspace = true, features = ["test"] }
amm-client = { workspace = true, features = ["test-support"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "write_manifest"
path = "examples/write_manifest.rs"

[lints]
workspace = true
